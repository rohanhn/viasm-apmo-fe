variables:
  DOCKER_TLS_CERTDIR: ''

.build_template: &build
  image: docker:dind
  stage: build
  services:
    - name: 'docker:dind'
      command: ['--tls=false', '--host=tcp://0.0.0.0:2375']
  before_script:
    - export CI_REGISTRY_IMAGE=$CI_REGISTRY/$CI_PROJECT_PATH
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - export APP_VERSION_SUBFIX=$(date +'%Y-%m-%d_%H-%M-%S')-`[ -n "$CI_COMMIT_TAG" ] && echo $CI_COMMIT_TAG || echo $CI_COMMIT_SHORT_SHA`
    - export APP_VERSION=$ENV_NAME-$APP_VERSION_SUBFIX
    - docker build --build-arg MODE=$ENV_NAME --build-arg NODE_ENVIROMENT=$ENV_NAME -t $CI_REGISTRY_IMAGE:$APP_VERSION . -f Dockerfile
    - docker push $CI_REGISTRY_IMAGE:$APP_VERSION
  tags: [build]


build_dev:
  variables:
    DOCKER_FILE: "Dockerfile"
    ENV_NAME: dev
  <<: *build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

build_staging:
  variables:
    DOCKER_FILE: "Dockerfile"
    ENV_NAME: staging
  <<: *build
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

build_prod:
  variables:
    DOCKER_FILE: "Dockerfile"
    ENV_NAME: prod
  <<: *build
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
